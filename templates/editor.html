<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Холст для рисования</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="/static/css/editor.css">
</head>

<body>
	<div class="editor-container">
		<div class="canvas-container">
			<canvas id="drawing-canvas" width="1200" height="800"></canvas>
		</div>

		<div class="tool-panel">
			<div class="user-info">
				<span id="username-display"><i class="fas fa-user"></i> Гость</span>
				<a href="/logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</a>
			</div>

			<div class="tool-section">
				<h3><i class="fas fa-paint-brush"></i> Кисть</h3>
				<select id="brush-size" class="tool-select">
					<option value="1">1px</option>
					<option value="3">3px</option>
					<option value="5" selected>5px</option>
					<option value="10">10px</option>
					<option value="20">20px</option>
					<option value="50">50px</option>
				</select>
			</div>

			<div class="tool-section">
				<h3><i class="fas fa-palette"></i> Цвет</h3>
				<div class="color-picker-wrapper">
					<input type="color" id="color-picker" value="#000000">
					<span id="current-color-hex">#000000</span>
				</div>
				<div class="color-presets">
					<div class="color-preset" data-color="#000000" style="background:#000000;"></div>
					<div class="color-preset" data-color="#ff0000" style="background:#ff0000;"></div>
					<div class="color-preset" data-color="#00ff00" style="background:#00ff00;"></div>
					<div class="color-preset" data-color="#0000ff" style="background:#0000ff;"></div>
					<div class="color-preset" data-color="#ffff00" style="background:#ffff00;"></div>
					<div class="color-preset" data-color="#ff00ff" style="background:#ff00ff;"></div>
					<div class="color-preset" data-color="#00ffff" style="background:#00ffff;"></div>
					<div class="color-preset" data-color="#ffffff" style="background:#ffffff;"></div>
				</div>
			</div>

			<div class="tool-section">
				<h3><i class="fas fa-tools"></i> Инструменты</h3>
				<button id="clear-btn" class="tool-btn danger">
					<i class="fas fa-trash-alt"></i> Очистить
				</button>
				<button id="save-btn" class="tool-btn primary">
					<i class="fas fa-save"></i> Сохранить
				</button>
				<button id="load-btn" class="tool-btn secondary">
					<i class="fas fa-folder-open"></i> Галерея
				</button>
			</div>
		</div>
	</div>

	<!-- Модальное окно галереи -->
	<div id="gallery-modal" class="modal-overlay">
		<div class="modal-container">
			<div class="modal-header">
				<h2><i class="fas fa-images"></i> Мои работы</h2>
				<span class="modal-close">&times;</span>
			</div>
			<div class="modal-body">
				<div class="gallery-controls">
					<div class="search-box">
						<i class="fas fa-search"></i>
						<input type="text" placeholder="Поиск по названию...">
					</div>
				</div>
				<div id="gallery-content" class="gallery-content">
					<!-- Сюда загружаются работы -->
				</div>
			</div>
			<div class="modal-footer">
				<button id="close-gallery-btn" class="tool-btn">Закрыть</button>
			</div>
		</div>
	</div>

	<script src="/static/js/editor.js"></script>
</body>

</html>
